gdn: 1
id: mrnaturl-holdings
version: 0.1.1
name: My Holdings Earnings
author: bbusch
description: Earnings for the stocks you own. Type their tickers, then see each one's next report date, before the open or after the close, EPS estimate, and the beat or miss once it reports
category: Finance
entry: app.star
width: 64
height: 32
refresh: 900
pages:
  - page_1
  - page_2
  - page_3
  - page_4
  - page_5
  - page_6
  - page_7
  - page_8
inputs:
  - key: stocks
    type: string
    app_input_type: free-text
    label: Your stocks
    default: ""
    help: Type the ticker symbols you want to follow, separated by commas or spaces (for example AAPL, MSFT, ACLS). Any US company that reports earnings works.
